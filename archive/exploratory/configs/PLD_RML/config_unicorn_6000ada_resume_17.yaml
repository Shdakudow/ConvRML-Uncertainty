gpu_setup:
  gpu_visible_id: "0"
  gpu_num: 0
  num_workers: 6
  parallel: false

infer:
  gpu_visible_id: "0"
  gpu_num: 0
  batch_size: 1
  save_ids: []
  save_uncropped: false
  save_metrics: true
  save_infer_dir: "./infer_results"

modes:
  wandb_on: false
  full_fov_loss: false
  img_number: 64

checkpoint:
  # Resume exactly after the completed first epoch of job 343615.
  load_checkpoint: true
  load_path: "./checkpoints/convnext_1.0_rml_mse_6_x4_downsize"
  wandb_id: ""
  project_name: "convrml-local"
  save_checkpoint_path: "./checkpoints"
  save_intermediate: true
  save_freq: 1

dataset:
  name: "rml"
  downsize_factor: 4
  size: 1.0
  use_processed: true
  data_path: "${oc.env:CONVRML_DATA_PATH}"

dataloader:
  batch_size: 6
  lr: 0.0003
  # Retained so the saved warmup/scheduler state is resumed consistently.
  warmup_epochs: 10

model:
  type: "convnext"
  size: "tiny"
  alpha: 0.0
  # Includes the completed epoch 1: 16 further epochs will run.
  num_epochs: 17
  input_height: 300
  input_width: 480
  output_height: 300
  output_width: 480
  n_channels: 3
  drop_path_rate: 0.2
  layer_scale_init_value: 1.0
  decoder_channels: [512, 256, 128, 64]
