gpu_setup:
  gpu_visible_id: "0"
  gpu_num: 0
  num_workers: 4
  parallel: false

modes:
  full_fov_loss: true

checkpoint:
  save_checkpoint_path: "./checkpoints"

run:
  name: "quantile_toy_fourier_smoke"

dataset:
  name: "toy_fourier"
  data_path: ${oc.env:CONVRML_DATA_PATH}
  downsize_factor: 1
  use_processed: true
  size: 1.0
  train_count: 64
  val_count: 32
  test_count: 32

toy:
  image_size: 64
  crop_size: 48
  seed: 20260918

dataloader:
  batch_size: 16

optimization:
  lr: 0.0003
  weight_decay: 0.001
  max_grad_norm: 1.0

loss:
  reconstruction_weight: 1.0
  pinball_weight: 1.0

quantile:
  minimum: 0.05
  maximum: 0.95
  embedding_dim: 128
  condition_channels: 32
  validation_levels: [0.1, 0.5, 0.9]

model:
  size: "tiny"
  num_epochs: 1
  input_height: 64
  input_width: 64
  output_height: 64
  output_width: 64
  n_channels: 3
  drop_path_rate: 0.1
  layer_scale_init_value: 1.0
  decoder_channels: [256, 128, 64, 32]
