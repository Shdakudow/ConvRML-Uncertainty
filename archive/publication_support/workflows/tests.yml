name: Portable workflow tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            reproducibility/constraints-tested.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' -c reproducibility/constraints-tested.txt
      - name: Check public formatting and fixture tests
        run: |
          python -m black --check convrml experiments tests
          python -m unittest discover -s tests -v
      - name: Check entry points
        run: |
          python -m convrml.train --help
          python -m convrml.evaluate --help
          python -m convrml.download --help
