[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "convrml-uncertainty"
version = "0.1.0"
description = "Lensless reconstruction and uncertainty model comparison"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm==1.0.22",
    "numpy>=1.24",
    "Pillow>=10",
    "torchmetrics==1.8.2",
    "scipy>=1.13",
]

[project.optional-dependencies]
plot = ["matplotlib==3.9.2"]
dev = ["black==25.1.0"]

[tool.setuptools]
py-modules = ["dataset", "train", "calibration"]

[tool.setuptools.packages.find]
include = ["convrml*", "models*", "configs*", "input_modifications*"]
exclude = ["*.__pycache__", "archive*", "tests*", "tools*"]

[tool.setuptools.package-data]
convrml = ["*.json"]
configs = ["*.json"]
input_modifications = ["*.md"]

[tool.black]
line-length = 88
target-version = ["py311"]
