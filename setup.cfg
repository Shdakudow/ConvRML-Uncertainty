[metadata]
name = convrml-uncertainty
version = 0.1.0
description = Lensless reconstruction and uncertainty model comparison
long_description = file: README.md
long_description_content_type = text/markdown
license_files = LICENSE

[options]
packages = find_namespace:
python_requires = >=3.9
install_requires =
    torch>=2.2
    torchvision>=0.17
    timm==1.0.22
    numpy>=1.24
    Pillow>=10

[options.packages.find]
include =
    convrml*
    experiments*
    shared
    shared.calibration*
exclude =
    *.__pycache__
    archive*
    tests*
    tools*
