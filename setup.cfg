[metadata]
name = convrml-uncertainty
version = 0.1.0
description = Lensless reconstruction and uncertainty model comparison
long_description = file: README.md
long_description_content_type = text/markdown
license_files = LICENSE

[options]
packages = find_namespace:
py_modules = dataset, train, infer
python_requires = >=3.9
install_requires =
    torch>=2.2
    torchvision>=0.17
    timm==1.0.22
    numpy>=1.24
    Pillow>=10
    torchmetrics==1.8.2
    scipy>=1.13

[options.package_data]
convrml = *.json
configs = *.json
input_modifications = README.md

[options.extras_require]
plot = matplotlib==3.9.2
dev =
    black==25.1.0

[options.packages.find]
include =
    convrml*
    models*
    configs*
    input_modifications*
exclude =
    *.__pycache__
    archive*
    tests*
    tools*
