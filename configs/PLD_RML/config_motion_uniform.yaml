gpu_setup:
  gpu_visible_id: "0"
  gpu_num: 0
  num_workers: 6
  parallel: false

modes:
  full_fov_loss: true

checkpoint:
  save_checkpoint_path: "./checkpoints"

run:
  name: "motion_uniform_gn"
  seed: 20260920

dataset:
  name: "toy_fourier"
  data_path: ${oc.env:CONVRML_DATA_PATH}
  downsize_factor: 1
  use_processed: true
  size: 1.0
  train_count: 8192
  val_count: 1024
  test_count: 1024

toy:
  image_size: 64
  crop_size: 48
  seed: 20260920
  psf: motion
  source_offset: 12000

dataloader:
  batch_size: 32

optimization:
  lr: 0.0003
  weight_decay: 0.001
  max_grad_norm: 1.0

loss:
  reconstruction_weight: 1.0
  pinball_weight: 1.0
  crossing_weight: 0.0

quantile:
  minimum: 0.0
  maximum: 1.0
  normalization: group
  embedding_dim: 128
  condition_channels: 32
  train_endpoints: false
  validation_levels: [0.05, 0.95]

model:
  size: "tiny"
  num_epochs: 8
  input_height: 64
  input_width: 64
  output_height: 64
  output_width: 64
  n_channels: 3
  drop_path_rate: 0.1
  layer_scale_init_value: 1.0
  decoder_channels: [256, 128, 64, 32]
