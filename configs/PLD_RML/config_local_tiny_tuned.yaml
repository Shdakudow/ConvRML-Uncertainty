# ConvRML-compatible RML reconstruction run.
# Set dataset.data_path to the PLD root on the machine that launches training.
gpu_setup:
  gpu_visible_id: "0"
  gpu_num: 0
  num_workers: 4
  parallel: false

infer:
  gpu_visible_id: "0"
  gpu_num: 0
  batch_size: 1
  save_ids: []
  save_uncropped: false
  save_metrics: true
  save_infer_dir: "./infer_results"

modes:
  wandb_on: false
  full_fov_loss: false
  img_number: 64

checkpoint:
  load_checkpoint: false
  load_path: ""
  wandb_id: ""
  project_name: "convrml-local"
  save_checkpoint_path: "./checkpoints"
  save_intermediate: true
  save_freq: 5

dataset:
  name: "rml"
  downsize_factor: 4
  size: 1.0
  use_processed: true
  # Required folders: 4x_rml/ and 4x_undistorted_GT2RML/
  data_path: "${oc.env:CONVRML_DATA_PATH}"

dataloader:
  batch_size: 6
  lr: 0.0003
  warmup_epochs: 10

model:
  type: "convnext"
  size: "tiny"
  alpha: 0.0
  num_epochs: 35
  input_height: 300
  input_width: 480
  output_height: 300
  output_width: 480
  n_channels: 3
  # Published architecture defaults. Tune only one group at a time.
  drop_path_rate: 0.2
  layer_scale_init_value: 1.0
  decoder_channels: [512, 256, 128, 64]
